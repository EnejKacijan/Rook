[build]
  # Review-only snapshot: retain this guard throughout the Claude visual audit.
  # Local builds still work. Netlify Git builds must stop before publishing.
  ignore = "exit 0"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  VITE_ROOK_EMAIL_PASSWORD_ROLLOUT = "true"

[context.production.environment]
  VITE_ROOK_ALL_SEASONS = "false"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
