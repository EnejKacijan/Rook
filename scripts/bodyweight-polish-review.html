<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<section id="fixture"><h1>Isolated bodyweight polish QA</h1><label>Variant <select id="variant"><option>weighted</option><option>bodyweight</option><option>timed</option><option>per-side</option><option>unloaded</option><option>assisted</option><option>distance</option></select></label><label>Text size <select id="text-size"><option value="16">100%</option><option value="24">150%</option><option value="32">200%</option></select></label><label>Scenario <select id="scenario"><option>standard</option><option>imported</option><option>long-name</option><option>custom</option><option>freestyle</option><option>history</option></select></label><label>Exercise <select id="exercise"><option value="0">first</option><option value="1">middle</option><option value="2">final</option></select></label><label>RIR <input id="rir" type="checkbox" checked></label><label>Theme <select id="theme"><option>light</option><option>dark</option><option>premium-light</option><option>premium-dark</option></select></label><label>PWA test mode <input id="pwa" type="checkbox" checked></label><label>Reduced motion test mode <input id="reduce" type="checkbox"></label><button id="seed">Start synthetic Final C review</button></section><div id="root"></div>
<script type="module">
import {createCustomExercise,customExerciseSnapshot} from '/src/customExercises.js';
import {startFreestyleWorkout,addFreestyleExercise} from '/src/freestyleWorkout.js';
import {createReturningUserFixture} from '/src/demoFixture.js';
import {serializeState,STORAGE_KEY,startWorkout,isoDay} from '/src/domain.js';
if(location.port!=='4198')throw Error('Isolated QA port required');const params=new URLSearchParams(location.search);
if(params.has('run')){
 // Explicit QA emulation only; production standalone/reduced-motion detection is unchanged.
 const realMatch=window.matchMedia.bind(window);window.matchMedia=q=>{const media=realMatch(q);if(q==='(display-mode: standalone)'||q==='(prefers-reduced-motion: reduce)')return {matches:q.includes('standalone')?params.has('pwa'):params.has('reduce'),media:q,addEventListener(){},removeEventListener(){},addListener(){},removeListener(){}};return media;};
 document.documentElement.style.fontSize=(params.get('text')||'16')+'px';document.querySelector('#fixture').remove();await import('/src/main.jsx');
 const qa=document.createElement('details');qa.id='edge-qa';qa.style.cssText='position:fixed;right:0;top:0;z-index:99999;background:#ddd;color:#111;font:11px system-ui;max-width:150px';qa.innerHTML='<summary>Gesture QA</summary><label>Replay <select id="gesture"><option>complete</option><option>cancel</option><option>vertical</option><option>outside</option></select></label><button id="replay">Replay synthetic touch</button><button id="inspect">Show persisted QA state</button><output id="phase">Ready</output><pre id="proof" style="white-space:pre-wrap;max-height:120px;overflow:auto"></pre>';document.body.append(qa);
 const proof=()=>{const a=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}').activeWorkout;return a?{id:a.id,startedAt:a.startedAt,exerciseIndex:a.exerciseIndex,exercises:a.exercises}:null;};
 qa.querySelector('#inspect').onclick=()=>{qa.querySelector('#proof').textContent=JSON.stringify(proof());};
 qa.querySelector('#replay').onmousedown=e=>e.preventDefault();
 qa.querySelector('#replay').onclick=()=>{const surface=document.querySelector('[data-active-workout]');if(!surface)return;const bounds=surface.getBoundingClientRect(),kind=qa.querySelector('#gesture').value,before=JSON.stringify(proof()),x=bounds.left+(kind==='outside'?90:4),y=300,end=x+(kind==='cancel'?38:bounds.width*.6);qa.open=false;
 const fire=(type,px,py)=>{const point=new Touch({identifier:1,target:surface,clientX:px,clientY:py,pageX:px+scrollX,pageY:py+scrollY});surface.dispatchEvent(new TouchEvent(type,{bubbles:true,cancelable:true,touches:type==='touchend'?[]:[point],targetTouches:type==='touchend'?[]:[point],changedTouches:[point]}));};
 fire('touchstart',x,y);fire('touchmove',end,kind==='vertical'?600:y);qa.querySelector('#phase').textContent='Dragging';qa.dataset.phase='dragging';setTimeout(()=>{fire('touchend',end,kind==='vertical'?600:y);setTimeout(()=>{qa.dataset.phase='complete';qa.querySelector('#phase').textContent='Replay finished';qa.querySelector('#proof').textContent=JSON.stringify({sameActive:JSON.stringify(proof())===before,active:proof()?.id,destination:document.querySelector('[data-active-workout]')?'workout':'today'});},260);},1800);};
}else document.querySelector('#seed').onclick=()=>{const s=createReturningUserFixture(0),kind=document.querySelector('#variant').value,theme=document.querySelector('#theme').value;Object.assign(s.profile,{rirEnabled:document.querySelector('#rir').checked,showExerciseImages:true,stylePreference:theme.startsWith('premium')?'premium':'standard',appearancePreference:theme.endsWith('dark')?'dark':'light',themePreference:theme.startsWith('premium')?'premium':theme});s.selectedDate=isoDay();const t=structuredClone(s.program.days[0]);t.name='Synthetic bodyweight polish';t.exercises=t.exercises.slice(0,3);t.exercises.forEach((e,i)=>{e.exerciseId=(kind==='timed'?['plank','side-plank','bosu-balance']:kind==='bodyweight'?['push-up','pull-up','chin-up']:kind==='per-side'?['split-squat','bulgarian-split-squat','step-up']:['leg-press','dumbbell-bench-press','incline-dumbbell-press'])[i];e.loggingMode=kind==='per-side'?'per_side':'normal';if(kind==='assisted')e.exerciseId='assisted-pull-up';if(kind==='unloaded'||kind==='distance'){const c=createCustomExercise(s,{name:'Synthetic '+kind+' '+i,equipment:['bodyweight'],primaryMuscle:'legs',pattern:'conditioning',loggingType:kind==='unloaded'?'reps':'distance_duration'}).exercise;Object.assign(e,{exerciseId:c.id,importedName:c.name,importedExercise:customExerciseSnapshot(c),measure:'reps',loadRequirement:'none'});}});const scenario=document.querySelector('#scenario').value;if(scenario==='imported'){const source='Bench Press 3x9 155 kg / machine press 3x8 173 kg';s.program.importMetadata={sourceNotes:[{text:source}]};t.exercises[0].notes=source;}if(scenario==='long-name'){t.name='A very long full body strength and conditioning workout title';t.exercises[0].importedName='Alternating incline dumbbell bench press with controlled eccentric';}if(scenario==='custom'){const custom=createCustomExercise(s,{name:'Prime incline press',equipment:['machines'],primaryMuscle:'chest',pattern:'horizontal-push',loggingType:'weight_reps'}).exercise;Object.assign(t.exercises[0],{exerciseId:custom.id,importedName:custom.name,importedExercise:customExerciseSnapshot(custom)});}if(kind==='bodyweight'){t.exercises[0].exerciseId='pull-up';t.exercises[1].exerciseId='incline-machine-press';t.exercises[2].exerciseId='rear-delt-fly';t.exercises[2].importedName='Rear Delt Fly';const raw='5. Rear Delt Fly – 2×7/stran 35 kg';t.exercises[2].notes='/stran 35 kg · '+raw;s.program.importMetadata={sourceNotes:[{text:raw}]};t.exercises[1].notes='Slow eccentric';}s.activeWorkout=startWorkout(s,t);if(scenario==='freestyle'){let freestyle=startFreestyleWorkout({...s,activeWorkout:null});for(const id of ['barbell-bench-press','dumbbell-bench-press','incline-dumbbell-press'])freestyle=addFreestyleExercise(freestyle,id);s.activeWorkout=freestyle.activeWorkout;}s.activeWorkout.exerciseIndex=Number(document.querySelector('#exercise').value);s.activeWorkout.startedAt=Date.now()-185000;s.activeWorkout.exercises.forEach((e,ei)=>{e.sets=e.sets.slice(0,3);for(const [i,set]of e.sets.entries()){Object.assign(set,{weight:kind==='timed'||kind==='bodyweight'&&ei===0?null:35,reps:kind==='timed'?30:9,rir:i===0?2:null,completed:i===0});if(kind==='per-side')set.sides={left:{reps:11,completed:i===0},right:{reps:12,completed:i===0}};}});if(scenario==='history'){const past=structuredClone(s.activeWorkout);past.id='synthetic-polish-history';past.completedAt=Date.now()-86400000;past.startedAt-=86400000;past.date='2026-09-17';past.exercises.forEach(e=>e.sets.forEach(set=>set.completed=true));s.workouts.push(past);}localStorage.setItem(STORAGE_KEY,serializeState(s));location.href='/scripts/bodyweight-polish-review.html?run=1&text='+document.querySelector('#text-size').value+(document.querySelector('#pwa').checked?'&pwa=1':'')+(document.querySelector('#reduce').checked?'&reduce=1':'');};
</script></body></html>
