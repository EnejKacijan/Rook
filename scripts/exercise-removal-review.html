<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROOK exercise removal QA</title><style>#swipe-qa{position:fixed;top:0;right:0;z-index:9999;font:11px system-ui;background:#eee;color:#111;max-width:180px}#proof{max-height:160px;overflow:auto;white-space:pre-wrap}</style></head><body><section id="setup"><label>Scenario <select id="scenario"><option>planned</option><option>freestyle</option><option>editor</option><option>scratch</option></select></label><label>Theme <select id="theme"><option>premium-dark</option><option>premium-light</option><option>dark</option><option>light</option></select></label><label><input id="rir" type="checkbox" checked>RIR</label><button id="start" disabled>Start synthetic review</button></section><div id="root"></div><script type="module">
import React,{useState} from 'react';
import {createRoot} from 'react-dom/client';
import {ActiveWorkout,PlanEditor} from '/src/App.jsx';
import {createReturningUserFixture} from '/src/demoFixture.js';
import {startWorkout,serializeState,deserializeState} from '/src/domain.js';
import {startFreestyleWorkout,addFreestyleExercise} from '/src/freestyleWorkout.js';
import '/src/styles.css';import '/src/overrides.css';import '/src/overlay.css';import '/src/calendar.css';import '/src/workout-controls.css';import '/src/onboarding-controls.css';import '/src/import-plan.css';import '/src/coach.css';import '/src/landing.css';import '/src/theme.css';import '/src/navigationFocus.css';import '/src/activeLoggerTouch.css';
if(!import.meta.env.DEV||location.origin!=='http://127.0.0.1:4198')throw Error('Isolated development review only');
const key='rook-swipe-qa-synthetic',params=new URLSearchParams(location.search);
const e=React.createElement;
function Harness({initial,scenario}){const [state,setState]=useState(initial),[done,setDone]=useState('');const update=fn=>setState(prev=>{const next=fn(structuredClone(prev));localStorage.setItem(key,serializeState(next));return next;});
return e(React.Fragment,null,scenario==='editor'||scenario==='scratch'?e('main',{className:'screen detail-screen'},e(PlanEditor,{source:state.program,profile:state.profile,exerciseState:state,mode:scenario==='editor'?'edit':'scratch',onSave:program=>{update(s=>({...s,program}));setDone('Saved draft');},onCancel:()=>setDone('Cancelled draft')})):e(ActiveWorkout,{state,update,setPage:()=>setDone('Back to Today'),setDetail:()=>setDone('Options requested')}),e('output',{id:'domain-proof'},JSON.stringify({done,id:state.activeWorkout?.id,current:state.activeWorkout?.exercises[state.activeWorkout.exerciseIndex]?.id,startedAt:state.activeWorkout?.startedAt,rest:state.activeWorkout?.rest,ids:state.activeWorkout?.exercises.map(e=>e.id),planIds:state.program.days[0].exercises.map(e=>e.id)})));}
if(!params.has('run')){const start=document.querySelector('#start');start.disabled=false;start.onclick=()=>{let s=createReturningUserFixture(0);const scenario=document.querySelector('#scenario').value,theme=document.querySelector('#theme').value;Object.assign(s.profile,{showExerciseImages:false,rirEnabled:document.querySelector('#rir').checked,stylePreference:theme.startsWith('premium')?'premium':'standard',appearancePreference:theme.endsWith('dark')?'dark':'light',themePreference:theme.startsWith('premium')?'premium':theme});if(scenario==='freestyle'){s=startFreestyleWorkout(s);for(const id of ['push-up','pull-up','dumbbell-bench-press','barbell-row'])s=addFreestyleExercise(s,id);}else if(scenario==='planned')s.activeWorkout=startWorkout(s,s.program.days[0]);if(s.activeWorkout){s.activeWorkout.exercises[0].sets[0].weight=52.5;s.activeWorkout.exercises[0].sets[0].completed=true;s.activeWorkout.rest={endsAt:Date.now()+900000};}localStorage.setItem(key,serializeState(s));location.href='?run=1&scenario='+scenario;};}
else{document.querySelector('#setup').remove();const state=deserializeState(localStorage.getItem(key),{strict:true});document.documentElement.dataset.appearance=state.profile.appearancePreference;document.documentElement.dataset.style=state.profile.stylePreference;createRoot(document.querySelector('#root')).render(e(Harness,{initial:state,scenario:params.get('scenario')}));
const qa=document.createElement('details');qa.id='swipe-qa';qa.innerHTML='<summary>Swipe QA</summary><label>Row <select id="row"><option value="0">A</option><option value="1">B</option></select></label><button id="left">Swipe left</button><button id="right">Swipe right</button><button id="vertical">Vertical</button><button id="diagonal">Diagonal</button><button id="edge">Left edge</button><button id="inspect">Inspect rows</button><pre id="proof"></pre>';document.body.append(qa);
const rows=()=>[...document.querySelectorAll('[data-swipe-row]')];
function proof(){const box=n=>{const b=n.getBoundingClientRect();return {x:b.x,y:b.y,width:b.width,height:b.height}};qa.querySelector('#proof').textContent=JSON.stringify(rows().map(r=>({name:r.querySelector('.plan-editor-heading strong,.up-next-title')?.textContent,box:box(r),open:r.hasAttribute('data-swipe-revealed'),enabled:r.dataset.swipeEnabled,transform:getComputedStyle(r.querySelector('[data-swipe-content]')).transform,action:box(r.querySelector('[data-swipe-action]')||r),pageOverflow:document.documentElement.scrollWidth>innerWidth})));}
async function gesture(kind){qa.querySelector('#proof').textContent='';const row=rows()[Number(qa.querySelector('#row').value)],target=row?.querySelector('.plan-editor-heading,.up-next-main');if(!target)return;row.scrollIntoView({block:'center'});await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);const b=row.getBoundingClientRect(),x=kind==='edge'?4:b.left+b.width*.7,y=b.top+b.height/2;const send=(type,dx,dy)=>{const event=new Event(type,{bubbles:true,cancelable:true});Object.defineProperty(event,'touches',{value:type==='touchend'?[]:[{identifier:1,clientX:x+dx,clientY:y+dy}]});target.dispatchEvent(event);};qa.open=false;send('touchstart',0,0);for(let i=1;i<=8;i++){send('touchmove',(kind==='right'?1:-1)*i*(kind==='vertical'?1:kind==='diagonal'?3:12),i*(kind==='vertical'?12:kind==='diagonal'?3:0));await new Promise(requestAnimationFrame);}send('touchend',-96,0);proof();}
for(const kind of ['left','right','vertical','diagonal','edge'])qa.querySelector('#'+kind).onclick=()=>gesture(kind);qa.querySelector('#inspect').onclick=()=>{proof();qa.open=false;};for(const button of qa.querySelectorAll('button,summary'))button.addEventListener('pointerdown',event=>event.preventDefault());}
</script></body></html>
